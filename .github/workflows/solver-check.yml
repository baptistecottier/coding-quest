name: Solver Check

on: [push]

jobs:
  run-modified-solvers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
    - name: Run coding_quest for modified solver files
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
          changed_files=$(git ls-files "events/*/day_*/solver_*.py" || true)
        else
          changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
        fi

        solver_files=$(printf '%s\n' "$changed_files" | grep -E '^events/(challenge|practice)_[0-9]{4}/day_[0-9]{2}/solver_.*\.py$' || true)

        if [[ -z "$solver_files" ]]; then
          echo "No modified solver .py files found in this push."
          exit 0
        fi

        failed=0
        while IFS= read -r file; do
          [[ -z "$file" ]] && continue
          if [[ "$file" =~ ^events/(challenge|practice)_([0-9]{4})/day_([0-9]{2})/solver_.*\.py$ ]]; then
            kind="${BASH_REMATCH[1]}"
            year="${BASH_REMATCH[2]}"
            day="${BASH_REMATCH[3]}"
            flag="-c"
            if [[ "$kind" == "practice" ]]; then
              flag="-p"
            fi

            echo "Running: uv run coding_quest.py $flag $year $day"
            if ! uv run coding_quest.py "$flag" "$year" "$day"; then
              failed=1
            fi
          fi
        done <<< "$solver_files"

        exit "$failed"
