[project]
name = "coding-quest"
version = "0.1.0"
description = "Solutions for the Coding Quest / Coding Challenges archive puzzles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.2.0",
    "ruff>=0.15.14",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
